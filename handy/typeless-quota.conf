# Typeless weekly quota, measured with `voice-quota-probe exhausted`.
#
# Typeless stores no limit and no reset date on disk: the server decides and
# announces it by showing an upgrade ad. So the allowance is whatever has
# accumulated in its own dictation log when that ad appears, and the reset is
# where usage starts counting again.
#
# Until both are filled in, voice-quota-watch does nothing and says so. Guessing
# either one is worse than not switching: too low steals Typeless while it still
# works, too high hands over only after the ad has already interrupted you.

# Minutes per week before Typeless refuses. Empty = not measured yet.
TYPELESS_LIMIT_MIN=

# Which weekday the allowance resets on: mon|sun. Empty = not measured yet.
TYPELESS_RESET_DAY=

# Switch this much before the limit, so the handover happens while Typeless
# still works rather than at the ad.
TYPELESS_MARGIN_MIN=3
