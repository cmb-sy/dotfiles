onboarding = false
[keys]
# Direct chords injected by Ghostty cmd shortcuts (terminal/ghostty/keybindings.conf).
# herdr forwards F1..F12 chords to panes but drops F13+, so the outer terminal
# translates cmd keys into modified F11/F12 chords that herdr can bind directly.
previous_tab = "shift+f11"      # Cmd+Shift+[
next_tab = "shift+f12"          # Cmd+Shift+]
new_tab = "ctrl+f10"            # Cmd+Opt+T
close_workspace = "shift+f10"   # Cmd+Opt+W
previous_workspace = "ctrl+f11" # Cmd+Opt+Up
next_workspace = "ctrl+f12"     # Cmd+Opt+Down

# lazygit in a throwaway pane: opens on Cmd+Ctrl+G, closes when lazygit exits.
# Lets git state be reviewed visually instead of reading raw diffs.
[[keys.command]]
key = "alt+f11"                 # Cmd+Ctrl+G
type = "pane"
command = "lazygit"

[ui]
agent_panel_sort = "priority"

[theme]
name = "catppuccin"
auto_switch = true
light_name = "catppuccin-latte"
dark_name = "catppuccin"

# Mark the workspace you still owe work to. herdr shows what the agent is
# doing; the marker records what you decided, which herdr cannot know.
# Cmd+Ctrl+M arrives as an alt+F9 chord from Ghostty, the same route lazygit
# uses above. Ctrl+M is not an option: terminals send it as CR, which is Enter.
# type = "shell" runs detached, so pressing the key draws nothing on screen.
# Wrapped in sh -c so $HOME expands whether herdr hands the string to a shell
# or execs it directly; a detached shell does not carry this repo's bin on PATH,
# and an absolute path here would write the account name into a tracked file.
[[keys.command]]
key = "alt+f9"                  # Cmd+Ctrl+M
type = "shell"
command = 'sh -c "$HOME/dotfiles/bin/herdr-mark"'
