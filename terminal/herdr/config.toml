onboarding = false
[keys]
# Direct chords injected by Ghostty cmd shortcuts (terminal/ghostty/keybindings.conf).
# herdr forwards F1..F12 chords to panes but drops F13+, so the outer terminal
# translates cmd keys into modified F11/F12 chords that herdr can bind directly.
previous_tab = "shift+f11"      # Cmd+Shift+[
next_tab = "shift+f12"          # Cmd+Shift+]
new_tab = "ctrl+f10"            # Cmd+Opt+T
close_workspace = "shift+f10"   # Cmd+Opt+W
previous_workspace = "ctrl+f11" # Cmd+Opt+Up
next_workspace = "ctrl+f12"     # Cmd+Opt+Down

# lazygit in a throwaway pane: opens on Cmd+Ctrl+G, closes when lazygit exits.
# Lets git state be reviewed visually instead of reading raw diffs.
[[keys.command]]
key = "alt+f11"                 # Cmd+Ctrl+G
type = "pane"
command = "lazygit"

[ui]
# spaces, not priority: priority orders rows by agent state alone and ignores
# the manual order entirely (verified — moving a workspace to index 0 did not
# move its row), so bin/herdr-sort could never float marked sessions to the top.
# Rows group by workspace here, so a marked tab brings its unmarked siblings
# with it; that is the cost of having the order follow the markers at all.
agent_panel_sort = "spaces"

[theme]
name = "catppuccin"
auto_switch = true
light_name = "catppuccin-latte"
dark_name = "catppuccin"

# Mark the session you still owe work to. herdr shows what the agent is doing;
# the marker records what you decided, which herdr cannot know.
# Cmd+Opt+M arrives as an alt+F9 chord from Ghostty, the same route lazygit
# uses above. Ctrl+M is not an option: terminals send it as CR, which is Enter.
# type = "pane" like lazygit, because the picker needs a terminal to draw in.
# The pane opens inside the current tab, so the session being marked is still
# the focused one. Wrapped in sh -c so $HOME expands whether herdr hands the
# string to a shell or execs it directly; the pane does not carry this repo's
# bin on PATH, and an absolute path here would write the account name into a
# tracked file.
[[keys.command]]
key = "alt+f9"                  # Cmd+Opt+M
type = "pane"
command = 'sh -c "$HOME/dotfiles/bin/herdr-mark pick"'
