onboarding = false
[keys]
# Direct chords injected by Ghostty cmd shortcuts (terminal/ghostty/keybindings.conf).
# herdr forwards F1..F12 chords to panes but drops F13+, so the outer terminal
# translates cmd keys into modified F11/F12 chords that herdr can bind directly.
previous_tab = "shift+f11"      # Cmd+Shift+[
next_tab = "shift+f12"          # Cmd+Shift+]
new_tab = "ctrl+f10"            # Cmd+Opt+T
close_workspace = "shift+f10"   # Cmd+Opt+W
previous_workspace = "ctrl+f11" # Cmd+Opt+Up
next_workspace = "ctrl+f12"     # Cmd+Opt+Down
toggle_sidebar = "ctrl+shift+f9" # Cmd+Ctrl+Left

# lazygit in a throwaway pane: opens on Cmd+Ctrl+G, closes when lazygit exits.
# Lets git state be reviewed visually instead of reading raw diffs.
[[keys.command]]
key = "alt+f11"                 # Cmd+Ctrl+G
type = "pane"
command = "lazygit"

# Shortcut cheat sheet in a throwaway pane: Cmd+Ctrl+H, q closes it.
# sh -c for the same reason as herdr-mark below ($HOME, no bin on PATH).
[[keys.command]]
key = "shift+f9"                # Cmd+Ctrl+H
type = "pane"
command = 'sh -c "$HOME/dotfiles/bin/help_key | less -R"'

# Issue board: Cmd+Ctrl+I focuses it, creating or restarting it when needed.
# The throwaway pane closes as soon as --jump returns.
[[keys.command]]
key = "ctrl+f9"                 # Cmd+Ctrl+I
type = "pane"
command = 'sh -c "$HOME/dotfiles/bin/herdr-issues --jump"'

[ui]
# priority orders rows by agent state (sessions that need you come first) and
# ignores the manual workspace order. Markers from bin/herdr-mark still show
# in the row labels.
agent_panel_sort = "priority"
# A folded sidebar (Cmd+Ctrl+Left) takes no width at all, not a numbered rail.
sidebar_collapsed_mode = "hidden"

# Background notifications. Change these with bin/herdr-notify, which edits the
# values below and reloads the server.
[ui.sound]
enabled = false

[ui.toast]
# off | herdr (in-app popup) | system (macOS banner, top right like Slack)
delivery = "system"

[ui.toast.herdr]
position = "top-right"

[theme]
name = "catppuccin"
auto_switch = true
light_name = "catppuccin-latte"
dark_name = "catppuccin"

# Mark the session you still owe work to. herdr shows what the agent is doing;
# the marker records what you decided, which herdr cannot know.
# Cmd+Opt+M arrives as an alt+F9 chord from Ghostty, the same route lazygit
# uses above. Ctrl+M is not an option: terminals send it as CR, which is Enter.
# type = "pane" like lazygit, because the picker needs a terminal to draw in.
# The pane opens inside the current tab, so the session being marked is still
# the focused one. Wrapped in sh -c so $HOME expands whether herdr hands the
# string to a shell or execs it directly; the pane does not carry this repo's
# bin on PATH, and an absolute path here would write the account name into a
# tracked file.
[[keys.command]]
key = "alt+f9"                  # Cmd+Opt+M
type = "pane"
command = 'sh -c "$HOME/dotfiles/bin/herdr-mark pick"'

# Dark background colour: Cmd+Ctrl+C steps to the next one (bin/ghostty-bg-cycle).
# The throwaway pane closes as soon as the script returns.
[[keys.command]]
key = "ctrl+f8"                 # Cmd+Ctrl+C
type = "pane"
command = 'sh -c "$HOME/dotfiles/bin/ghostty-bg-cycle"'

# Repository order of the issue board: Cmd+Ctrl+L, q saves, Esc cancels.
[[keys.command]]
key = "shift+f8"                # Cmd+Ctrl+L
type = "pane"
command = 'sh -c "$HOME/dotfiles/bin/herdr-issues --order"'

# Claude Code's statusline in a pane on the right: Cmd+Ctrl+Right opens it, again closes it.
[[keys.command]]
key = "alt+f8"                  # Cmd+Ctrl+Right
type = "pane"
command = 'sh -c "$HOME/dotfiles/bin/herdr-statusline toggle"'
