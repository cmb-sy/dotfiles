# lazygit is the secondary tool here: Claude Code stages, commits and pushes,
# so this config optimises for reading -- seeing which files changed and what
# the diff says -- rather than for authoring commits.

gui:
  # The five side panels are fixed and cannot be hidden, so instead let
  # whichever one has focus grow and the rest collapse. Without this, a repo
  # with 15 changed files shows about 6 of them while Branches and Stash sit
  # empty above and below.
  expandFocusedSidePanel: true
  expandedSidePanelWeight: 3

  # Frees the bottom-right corner for the diff. The log shows the git commands
  # lazygit runs, which matters when lazygit is doing the work -- here it is
  # not. Set back to true to inspect what a keypress actually ran.
  showCommandLog: false

  # How far a branch has drifted from the base branch, with the count -- the
  # worktrees here sit on feature branches for days, and this says how much
  # main has moved underneath them. Not the same as ahead/behind the remote:
  # lazygit shows that against the upstream in the branches panel already.
  showDivergenceFromBaseBranch: arrowAndNumber

  # Fuzzy rather than substring matching, so `/` finds a file in a long list
  # without typing a contiguous fragment of the path.
  filterMode: fuzzy

  # Several views are sub-tabs rather than panels of their own -- Worktrees and
  # Submodules sit behind Files, Remotes and Tags behind Local branches -- and
  # are otherwise only reachable with `[` / `]`. With this on, pressing the
  # panel's own number again cycles its tabs, so 2 2 lands on Worktrees.
  switchTabsWithPanelJumpKeys: true

  theme:
    # The default selection background is ANSI blue, which assumes blue is
    # dark. Ghostty remaps colour 4 to #5CC8FF, a light cyan, leaving near-
    # white text on a near-white bar. Colour 0 is not remapped, so it stays
    # the palette's dark grey and keeps the text legible.
    selectedLineBgColor:
      - black

git:
  # More surrounding context per hunk than the default of 3, since this view
  # is for reading rather than for staging individual lines.
  diffContextSize: 6

  # Selecting a branch shows which files it touches before its commit log, so
  # the shape of the change is visible without opening any commit.
  #   - HEAD...branch, which git defines as merge-base(HEAD,branch)..branch, so
  #     no hardcoded main (works where the trunk is master) and no $() subshell.
  #     lazygit substitutes {{branchName}} into a string a shell then runs, and
  #     git permits `;`, `$`, backtick and `&` in branch names, so a subshell
  #     here would execute whatever a fetched branch name contained.
  #   - the substitutions are quoted for the same reason. Not airtight: git also
  #     permits `"` in ref names, and lazygit's own default branchLogCmd carries
  #     the same exposure, so this raises the bar rather than closing the hole.
  #   - --name-status rather than --stat: --stat elides long paths to `.../`,
  #     which drops exactly the directory information this is here to show
  #   - core.quotePath=false so Japanese filenames render as themselves rather
  #     than as octal escapes
  branchLogCmd: 'git -c core.quotePath=false diff --name-status "HEAD...{{branchName}}"; echo; git log --graph --color=always --abbrev-commit --decorate --date=relative --pretty=medium "{{branchName}}" --'

os:
  # Pinned rather than inherited from $EDITOR: a lazygit started before the
  # shell exported EDITOR=nvim would otherwise still open plain vim.
  editPreset: nvim
