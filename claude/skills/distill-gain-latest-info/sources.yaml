# gain watch sources
# Add sources per section. gain watch reads this file to know what to observe.
# NOTE: empty sections scaffold as `key: []` with commented-out examples underneath.
# Before uncommenting an example, remove the `[]` from that key first —
# a key set to `[]` followed by uncommented `- ` list items is invalid YAML.

# dotfiles peers — adoption workflow targets
#   handles: GitHub handles to watch, each with the reason for watching it
#   overrides: owner/name only for repos differing from default <handle>/dotfiles
# The note is a field, not a trailing comment: a comment is invisible to the
# parser, so the reason would never reach the table the review reads.
peers:
  handles:
    - handle: neko-neko
      note: Tokyo; traditional tmux/Tailscale/sesh stack
    - handle: joshukraine
      note: Claude Code skills via _shared/house-style.html
    - handle: shunk031
      note: AGENTS.md SSOT + symlinks for Claude/Codex/Gemini
    - handle: yutkat
      note: version-tag releases; NixOS/Arch; bundled Codex prompts
  overrides: {}

# General repos — watch commits/releases (not limited to dotfiles)
github:
  - repo: mizchi/vibe-lang
    note: active experimental language for AI coding
  - repo: netresearch/agent-harness-skill
    note: A/B measurements on skill activation wording (1/6 -> 6/6 by moving the trigger to the opening phrase)
  - repo: netresearch/agent-system-evals
    note: how to measure agent behaviour; the layer my bats suite lacks
  - repo: cjpais/Handy
    note: releases only — upstream moves without me noticing. Check the local version in /Applications/Handy.app Info.plist (CFBundleShortVersionString), never a fixed number here
  - repo: ollama/ollama
    note: releases only — new versions of the free local runtime behind Handy voice post-processing
  - repo: jdx/mise
    note: releases only — runtime/tool manager behind the Brewfile and .zshrc here; its dotfiles features (mise dot) move weekly, and peer yutkat applies dotfiles with it
  - repo: modelcontextprotocol/modelcontextprotocol
    note: releases only — dated MCP spec versions. The spec changelog page has no per-entry dates, so this is the dated signal
    cadence: monthly
  - repo: mitre-atlas/atlas-data
    note: releases only — monthly MITRE ATLAS data drops (vYYYY.MM); new attack techniques on AI systems and case studies. atlas.mitre.org itself is undated
    cadence: monthly

# Service changelog / release pages
# Every entry here has to be a page that dates its own entries: collection
# takes the ones inside the window. A reference doc has nothing to take that
# way and records "found nothing" every week, which is what decides who gets
# dropped -- so do not put one here.
services:
  - name: Claude Code
    url: https://code.claude.com/docs/en/changelog
    note: primary daily tool; weekly feature drops. This page dates each entry, which the GitHub CHANGELOG does not -- the 7-day window needs the dates
  - name: Anthropic API
    url: https://platform.claude.com/docs/en/release-notes/overview
    note: model/API updates; feeds Databricks & AI work
  - name: Obsidian
    url: https://obsidian.md/changelog/
    note: vault workflow foundation
  - name: Databricks
    url: https://docs.databricks.com/aws/en/release-notes/product/
    note: 仕事で中心的に使う。Delta Lake・VIEW・Genie・SQL 関数の挙動変更は直接影響する。この一覧ページには日付が無い。日付は月別ページ（/release-notes/product/YYYY/{month}）にあるので、収集時はリンクを辿る
  - name: Databricks SQL
    url: https://docs.databricks.com/aws/en/sql/release-notes/
    note: VIEW のスキーマ固定や Delta の読み取り挙動はここに出る
  - name: Claude system prompt
    url: https://platform.claude.com/docs/en/release-notes/system-prompts/overview.md
    note: this overview has no dates -- it only links to per-model pages, which carry
      the dates. Follow those links when collecting. The .md body would also diff cleanly
      between versions, but nothing here compares versions yet -- it is read as a changelog
  # AI security. Entries marked cadence: monthly change a few times a month at
  # most: they are still visited weekly, but sources mode keeps them through
  # empty weeks instead of offering them for removal.
  - name: Anthropic News
    url: https://www.anthropic.com/news
    note: model launches, system cards, policy and safety announcements; dated per entry
  - name: Claude apps
    url: https://support.claude.com/en/articles/12138966-release-notes
    note: claude.ai / Desktop / Enterprise / Team release notes; admin and connector (MCP) changes land here. Dated per entry
  - name: Anthropic Research
    url: https://www.anthropic.com/research
    note: interpretability / alignment / safety papers; dated per entry
    cadence: monthly
  - name: Anthropic Frontier Red Team
    url: https://www.anthropic.com/research/team/frontier-red-team
    note: capability and misuse evaluations of frontier models
    cadence: monthly
  - name: OpenAI News
    url: https://openai.com/news/rss.xml
    note: all OpenAI news; take only model launches, system cards and safety posts. The safety-alignment list page answers 403 to non-browser clients, so read the feed
  - name: Google DeepMind
    url: https://deepmind.google/blog/rss.xml
    note: the HTML blog list only shows month-level dates; the RSS carries full dates, so read the feed
    cadence: monthly
  - name: OWASP GenAI Security Project
    url: https://genai.owasp.org/feed/
    note: LLM Top 10 / Agentic AI Top 10 releases and updates. The /blog/ HTML mixes in a placeholder date, so read the feed
    cadence: monthly
  - name: Japan AISI
    url: https://aisi.go.jp/activity/activity_news/
    note: AI セーフティ・インスティテュートの活動報告。日付つき一覧（成果物は /output/output_information/ に別掲）
    cadence: monthly
  - name: NIST CAISI
    url: https://www.nist.gov/caissi
    note: US center for AI standards; dated news on frontier-model assessments
    cadence: monthly
  - name: EU AI Act
    url: https://artificialintelligenceact.eu/feed/
    note: unofficial but widely used tracker; dated posts on enforcement, guidance and the implementation timeline
    cadence: monthly

# Daily flow layer -- read by bin/gain-stream on every watch, not by
# gain-state (it has no key for these, so they never enter the weekly
# cooldown). Each list is a set of queries for that source.
topics:
  - name: ローカル LLM
    note: Handy のローカル音声モードの後継モデル候補（小型・日本語・Mac で動く）
    hn: ["ollama", "local llm", "gguf"]
    hatena: ["ローカルLLM", "Ollama"]
    qiita: ["ollama", "llm"]
    zenn: ["ollama", "llm"]
    bluesky: ["ollama"]
  - name: Handy・音声入力
    note: 音声入力のワークフロー。Handy の代わりや周辺ツール
    hn: ["speech to text", "whisper", "dictation"]
    hatena: ["音声入力"]
    zenn: ["whisper"]
  - name: Claude Code・AI コーディング
    note: 毎日使う道具。競合（Cursor・Codex）も含む
    hn: ["claude code", "coding agent", "codex"]
    hatena: ["Claude Code"]
    qiita: ["claudecode"]
    zenn: ["claudecode"]
    lobsters: ["ai"]
    bluesky: ["claude code"]
  - name: AI エージェントのハーネス
    note: CLAUDE.md・skills・hooks の運用。harness-audit の基準になる
    hn: ["agent harness", "agents.md"]
    zenn: ["aiagent"]
  - name: Databricks
    note: 業務の中核。VIEW・Delta・Genie の挙動変更は直接効く
    hn: ["databricks"]
    hatena: ["Databricks"]
    qiita: ["databricks"]
    zenn: ["databricks"]
  - name: AI セキュリティ
    note: プロンプトインジェクション・脱獄・モデル公開と安全性報告・MCP や Claude の変更・ガバナンス。動向レベルで要約し、実装の細部は書かない。実装トレンドは攻撃面の観点だけ
    hn: ["ai security", "llm security", "ai safety"]
    hatena: ["AIセキュリティ", "LLM セキュリティ", "MCP セキュリティ"]
    qiita: ["プロンプトインジェクション", "AIセキュリティ"]
    zenn: ["promptinjection", "aisafety"]
  - name: キャリア
    section: career
    note: エンジニアがキャリアをどう歩んでいるか。職種の移り方・評価・学び方・AI 時代の働き方
    hn: ["career"]
    hatena: ["エンジニア キャリア", "エンジニアリングマネージャー"]
    qiita: ["キャリア", "career"]
    zenn: ["career"]

# People whose own writing is worth reading every day. SNS only where a
# free, dated feed exists: X has no free read path, so it is not here.
people:
  - name: Simon Willison
    blog: https://simonwillison.net/atom/everything/
    bluesky: simonwillison.net
    mastodon: https://fedi.simonwillison.net/@simon.rss
    note: LLM tooling practice; highest signal in the space
  - name: mizchi
    blog: https://zenn.dev/mizchi/feed
    note: Zenn is authoritative (mizchi.dev serves stale 2020 cache). His SNS is X only; the Bluesky account is dormant

# Trending in any field. Popular-now sources are not cut by date (most of
# what is popular this week was published before yesterday); the digest's
# 7-day URL check drops what was already shown.
discover:
  hn_front: {min_points: 200}
  show_hn: {min_points: 80}
  hatena_it: {min_bookmarks: 100}
  zenn_trend: {limit: 10}
  qiita_popular: {limit: 10}
  github_new: {min_stars: 300}
  ollama_newest: {limit: 10}
  hf_trending: {filters: ["text-generation", "automatic-speech-recognition"], limit: 10}
