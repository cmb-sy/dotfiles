# gain watch sources
# Add sources per section. gain watch reads this file to know what to observe.
# NOTE: empty sections scaffold as `key: []` with commented-out examples underneath.
# Before uncommenting an example, remove the `[]` from that key first —
# a key set to `[]` followed by uncommented `- ` list items is invalid YAML.

# dotfiles peers — adoption workflow targets
#   handles: GitHub handles to watch, each with the reason for watching it
#   overrides: owner/name only for repos differing from default <handle>/dotfiles
# The note is a field, not a trailing comment: a comment is invisible to the
# parser, so the reason would never reach the table the review reads.
peers:
  handles:
    - handle: neko-neko
      note: Tokyo; traditional tmux/Tailscale/sesh stack
    - handle: joshukraine
      note: Claude Code skills via _shared/house-style.html
    - handle: shunk031
      note: AGENTS.md SSOT + symlinks for Claude/Codex/Gemini
    - handle: yutkat
      note: version-tag releases; NixOS/Arch; bundled Codex prompts
  overrides: {}

# General repos — watch commits/releases (not limited to dotfiles)
github:
  - repo: neko-neko/belt
    note: LLM-driven Agent Skills workflow engine; directly relevant to my skill ops
  - repo: mizchi/vibe-lang
    note: active experimental language for AI coding
  - repo: netresearch/agent-harness-skill
    note: A/B measurements on skill activation wording (1/6 -> 6/6 by moving the trigger to the opening phrase)
  - repo: netresearch/agent-system-evals
    note: how to measure agent behaviour; the layer my bats suite lacks
  - repo: cjpais/Handy
    note: releases only — local is 0.8.3 and upstream moves without me noticing
  - repo: ollama/ollama
    note: releases only — new versions of the free local runtime behind Handy voice post-processing

# Service changelog / release pages
# Every entry here has to be a page that dates its own entries: collection
# takes the ones inside the window. A reference doc has nothing to take that
# way and records "found nothing" every week, which is what decides who gets
# dropped -- so do not put one here.
services:
  - name: Claude Code
    url: https://code.claude.com/docs/en/changelog
    note: primary daily tool; weekly feature drops. This page dates each entry, which the GitHub CHANGELOG does not -- the 14-day window needs the dates
  - name: Anthropic API
    url: https://platform.claude.com/docs/en/release-notes/overview
    note: model/API updates; feeds Databricks & AI work
  - name: Obsidian
    url: https://obsidian.md/changelog/
    note: vault workflow foundation
  - name: Databricks
    url: https://docs.databricks.com/aws/en/release-notes/product/
    note: 業務の中核。Databricks-Analysis / data-platform / 白書自動化がすべて依存する。Delta Lake・VIEW・Genie・SQL 関数の挙動変更は直接影響する
  - name: Databricks SQL
    url: https://docs.databricks.com/aws/en/sql/release-notes/
    note: VIEW のスキーマ固定や Delta の読み取り挙動はここに出る。2026-09-02 の 5 時間障害は VIEW のスキーマ変更が原因だった
  - name: Claude system prompt
    url: https://platform.claude.com/docs/en/release-notes/system-prompts/overview.md
    note: the page dates its entries. The .md body would also diff cleanly between
      versions, but nothing here compares versions yet -- it is read as a changelog

# Engineers to follow via blog (RSS) and SNS (best-effort)
engineers:
  - name: Simon Willison
    blog: https://simonwillison.net/atom/everything/
    note: LLM tooling practice; highest signal in the space
  - name: mizchi
    blog: https://zenn.dev/mizchi/feed
    note: Zenn is authoritative (mizchi.dev serves stale 2020 cache). blog only -- the code shows up in github/mizchi/vibe-lang, and the SNS slot returned nothing but a low-confidence label

# Impact news — search queries
news:
  - query: "AI coding agent 新機能 比較"
    note: Claude Code / Cursor / Codex competitive landscape
  - query: "音声入力 コーディング dictation STT ツール"
    note: alternatives/new tools around Handy/Typeless workflow
  - query: "dotfiles 開発環境 ツール トレンド"
    note: dev-environment new practices
  - query: "開発者ツール 話題 トレンド"
    note: catch-all for whatever is trending
  - query: "ローカルLLM 小型モデル 日本語 Ollama 新モデル"
    note: successor candidates for qwen3:4b in Handy local voice mode (small, ja-capable, runs on Mac)
  - query: "small local LLM new model Ollama English instruct"
    note: en-mode candidates for Handy local voice (voice-switch en)
  - query: "AI coding agent harness ベストプラクティス CLAUDE.md 運用 構築"
    note: harness construction practices; feeds harness-audit Level 4 anchors
  - query: "agentic coding workflow harness best practices"
    note: EN sources for the same; top-engineer harness patterns
  - query: "Databricks Delta Lake VIEW スキーマ 変更 運用"
    note: 業務の中核。VIEW のスキーマ固定で実際に障害を出しているため、運用上の落とし穴を拾う
  - query: "Databricks AI/BI Genie MCP 活用"
    note: Genie と MCP サーバーの両方を出口にしている。他社の使い方と機能追加を追う
